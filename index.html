

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vampire Challenge</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container welcome">

    <div class="vampire">
        🧛
    </div>

    <h1>
        VAMPIRE CHALLENGE
    </h1>

    <p class="subtitle">
        Welcome to the Tech Vampire Round
    </p>


    <div class="form-box">

        <label>
            Team Name
        </label>

        <input
            type="text"
            id="teamName"
            placeholder="Enter Team Name"
            autocomplete="off"
        >


        <label>
            Team ID
        </label>

        <input
            type="text"
            id="teamId"
            placeholder="Enter Team ID"
            autocomplete="off"
        >


        <button onclick="startRound()">
            ENTER
        </button>


        <p
            id="error"
            class="error"
        ></p>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
