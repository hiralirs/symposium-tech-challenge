<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Level 2: The Vampire's Puzzle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body onload="initLevel2()">
  <div class="container">
    <div id="timerDisplay" class="hidden"></div>

    <!-- Active Puzzle Area -->
    <div id="s2ActiveArea" class="hidden">
      <h3 id="s2Progress" class="gothic-text">Puzzle 1 of 5</h3>
      <p id="s2QuestionText"></p>
      <input type="text" id="s2AnswerInput" class="input-box" placeholder="Your answer...">
      <br>
      <button class="btn" onclick="submitStage2Answer()">Submit Answer</button>
      <br><br>
      <button class="btn" onclick="toggleHint()" style="background: #333; font-size: 0.9rem;">Reveal Hint</button>
      <p id="hintBox" class="hidden"></p>
    </div>

    <!-- End of Level Area -->
    <div id="s2ScoreArea" class="hidden">
      <h2 class="gothic-text">You Survived the Crypt!</h2>
      <p>Stage 2 Score: <span id="s2ScoreVal" class="highlight"></span> / 5</p>
      <button class="btn" onclick="goToResults()">View Final Results</button>
    </div>
  </div>

  <!-- Intros/Modals -->
  <div id="stage2InstModal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 class="gothic-text">📜 Level 2 Instructions</h3>
      <p>Welcome to Level 2: Vampire's Logic! You have 5 minutes to solve 5 logical puzzles.</p>
      <button class="btn" onclick="showHintNoticeModal()">Next</button>
    </div>
  </div>

  <div id="stage2HintModal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 class="gothic-text">💡 A Word on Hints</h3>
      <p>Hints are available for every puzzle to guide you in the dark. Use them wisely!</p>
      <button class="btn" onclick="startLevel2Actual()">Start Level 2</button>
    </div>
  </div>

  <!-- Security Modal -->
  <div id="secModal" class="modal-overlay hidden">
    <div class="modal-box" style="border: 2px solid #ff4d4d;">
      <h3 style="color: #ff4d4d;">🛑 SECURITY ALERT</h3>
      <p id="secModalMsg" style="white-space: pre-wrap;"></p>
      <button class="btn" onclick="closeSecModal()" style="background: #ff4d4d;">Acknowledge & Return</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
