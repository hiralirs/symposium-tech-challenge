<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stage 1 - Python</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glass-panel">
    <div class="header-bar">
      <span id="teamDisplayS1" style="font-weight: bold; color: var(--blood-red);"></span>
      <span id="timerS1" class="timer">05:00</span>
    </div>

    <div id="s1ActiveArea">
      <h3 id="s1Progress" class="gothic-text" style="font-size: 1.8rem; margin-bottom: 5px;">Question 1 of 5</h3>
      
      <p style="color: #bbb; font-size: 0.9rem; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; text-align: left;">
        <b>Instructions:</b> Read the Python code and click the correct output. The moment you click an option, you will instantly move to the next question. You cannot go back.
      </p>

      <pre id="s1CodeBlock" class="code-block"></pre>
      <div id="s1Options" class="options-grid"></div>
    </div>
  </div>

  <div id="secModal" class="modal-overlay hidden">
    <div class="modal-box" style="border: 2px solid #ff3333;">
      <h2 style="color: #ff3333; font-size: 2rem; margin-bottom: 10px;">⚠️ SECURITY WARNING ⚠️</h2>
      <p id="secMsg" style="font-size: 1.2rem; margin-bottom: 20px; white-space: pre-wrap;"></p>
      <button class="btn" onclick="closeSecModal()">I Understand</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    window.onload = () => {
      initSecurity();
      startLevel1();
    };
  </script>
</body>
</html>
