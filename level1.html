<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Level 1: Python's Bite</title>
  <link rel="stylesheet" href="style.css">
</head>
<body onload="initLevel1()">
  <div class="container">
    <div id="timerDisplay" class="hidden"></div>
    
    <!-- Active Quiz Area -->
    <div id="s1ActiveArea">
      <h3 id="s1Progress" class="gothic-text">Question 1 of 5</h3>
      <p>Analyze the following Python curse:</p>
      <pre id="s1CodeBlock" class="code-block"></pre>
      <div id="s1Options" style="display: flex; flex-wrap: wrap; justify-content: center;"></div>
    </div>

    <!-- End of Level Area -->
    <div id="s1ScoreArea" class="hidden">
      <h2 class="gothic-text">Level 1 Cleared!</h2>
      <p>Stage 1 Score: <span id="s1ScoreVal" class="highlight"></span> / 5</p>
      <button class="btn" onclick="goToLevel2()">Proceed to Level 2</button>
    </div>
  </div>

  <!-- Security Modal -->
  <div id="secModal" class="modal-overlay hidden">
    <div class="modal-box" style="border: 2px solid #ff4d4d;">
      <h3 style="color: #ff4d4d;">🛑 SECURITY ALERT</h3>
      <p id="secModalMsg" style="white-space: pre-wrap;"></p>
      <button class="btn" onclick="closeSecModal()" style="background: #ff4d4d;">Acknowledge & Return</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
