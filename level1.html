<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Level 1 - Vampire's Logic</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="top-bar">

        <span>
            Team:
            <b id="teamNameDisplay"></b>
        </span>

        <span>
            ID:
            <b id="teamIdDisplay"></b>
        </span>

    </div>


    <h1>🩸 LEVEL 1</h1>

    <h2>Vampire's Logic</h2>


    <div class="timer">

        ⏱ Time Left:
        <span id="timer">06:00</span>

    </div>


    <div class="progress">

        Question
        <span id="questionNumber">1</span>
        of 5

    </div>


    <div id="questionContainer"></div>


    <button
        id="nextButton"
        onclick="nextQuestion()"
    >
        NEXT
    </button>


    <p
        id="questionError"
        class="error"
    ></p>

</div>


<script src="script.js"></script>

<script>
    loadLevel1();
</script>

</body>
</html>
