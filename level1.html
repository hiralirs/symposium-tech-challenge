<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Level 1 - Vampire's Logic</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="timer-box">
    ⏱️ <span id="timer">05:00</span>
</div>

<div class="page">

    <div class="container">

        <h1 class="blood-title">
            🧠 LEVEL 1
        </h1>

        <h2 class="red-heading">
            VAMPIRE'S LOGIC
        </h2>

        <div class="card">

            <div class="question-number">
                Question <span id="questionNumber">1</span> / 5
            </div>

            <div class="progress-container">
                <div id="progressBar"></div>
            </div>

            <div id="questionBox" class="question-box">
                Question
            </div>

            <div id="optionsBox"></div>

            <p class="enter-info">
                Select an answer or press <b>ENTER</b> to continue.
            </p>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
