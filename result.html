<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Verdict</title>
    <link rel="stylesheet" href="game.css">
    
    <!-- === ANTI-COPY & ANTI-SELECT PROTECTION === -->
    <style>
        body {
            user-select: none; /* Prevents text highlighting */
            -webkit-user-select: none; /* Safari */
            -moz-user-select: none; /* Firefox */
            -ms-user-select: none; /* Older IE/Edge */
        }

        /* Forcefully hides any button or restart element on the verdict page, except our finish button */
        .glass-panel button:not(#finishBtn), 
        .glass-panel .btn:not(#finishBtn), 
        #restart-btn, 
        [onclick*="restart"], 
        [onclick*="playAgain"] {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="glass-panel" style="text-align: center; max-width: 600px;">
        <h1 class="gothic-text" style="font-size: 3.5rem; margin-bottom: 10px;">The Verdict</h1>
        <h2 id="teamResultName" style="color: var(--blood-red); font-size: 1.8rem; margin-bottom: 20px;"></h2>

        <div style="margin: 30px auto; padding: 30px 20px; max-width: 400px; border: 1px solid rgba(255, 0, 0, 0.3); background: rgba(0, 0, 0, 0.5); border-radius: 8px;">
            <div style="font-size: 1.4rem; margin-bottom: 15px;" id="round1Display">Round 1 Score: <span style="color: var(--blood-red);">0</span></div>
            <div style="font-size: 1.4rem; margin-bottom: 15px;" id="round2Display">Round 2 Score: <span style="color: var(--blood-red);">0</span></div>
            <h2 style="font-size: 2.2rem; margin: 0;">Final Score: <span id="finalScoreDisplay" style="color: var(--blood-red);">0</span> / 10</h2>

            <div style="margin-top: 25px;">
                <h3 id="rankDisplay" class="gothic-text" style="font-size: 1.4rem; margin: 0; text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);"></h3>
            </div>
        </div>

        <button id="finishBtn" class="btn continue-button" style="margin-top: 25px; width: 100%;">FINISH <span>→</span></button>

        <p style="color: #666; font-size: 0.8rem; margin-top: 30px;">Your results have been sealed in the crypt archives.</p>
    </div>

    <script src="game.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', function() {
            if (typeof loadResult === 'function') {
                loadResult();
            }
            
            // Safety check: Removes any unwanted buttons except the finish button
            const buttons = document.querySelectorAll('button:not(#finishBtn), .btn:not(#finishBtn)');
            buttons.forEach(btn => btn.remove());
        });

        document.getElementById('finishBtn').addEventListener('click', function() {
            window.location.href = 'thanks.html';
        });
    </script>
</body>
</html>
