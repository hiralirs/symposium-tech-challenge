<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Final Results</title>
  <link rel="stylesheet" href="style.css">
</head>
<body onload="initResults()">
  <div class="container">
    <h2 style="color: #ccc;">Team:</h2>
    <h1 class="gothic-text" id="finalTeamName">Team Name</h1>
    
    <h2>Final Score: <span id="finalTotalScore" class="highlight">0 / 10</span></h2>
    <h3 id="violationCountDisplay" style="margin-top: 10px; font-size: 1.2rem;">Security Violations: 0</h3>
    
    <h3 id="vampireTitle" style="margin-top: 20px; font-style: italic;">Title</h3>
    
    <br><br>
    <button class="btn" onclick="restartApp()" style="background: #222;">Return to Start</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
