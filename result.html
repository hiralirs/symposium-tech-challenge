<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Final Result</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="page">

    <div class="container">

        <h1 class="blood-title">
            🏆 CHALLENGE COMPLETE
        </h1>

        <div class="card result-card">

            <h2 id="resultTeam">
                TEAM
            </h2>

            <div class="score-circle">

                <span id="finalScore">
                    0
                </span>

                <small>/ 100</small>

            </div>

            <h2 class="red-heading">
                🩸 FINAL SCORE
            </h2>

            <p id="resultMessage"
               class="result-message">
            </p>

            <button id="restartBtn">
                🔄 PLAY AGAIN
            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
